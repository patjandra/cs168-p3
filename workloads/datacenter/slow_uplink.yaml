# Rack 1's uplink drops from 150 to 75 Mbps for good after round 2, so the
# fixed pacing rate is now twice what that rack can carry off-rack.
id: slow_uplink
seed: 1
drain_s: 3
flows:
  - {pattern: incast, src: "sender*", dst: "receiver*", exclude_self: true,
     direction: allreduce, start_s: 1.0, period_s: 1.0, rounds: 6,
     burst_bytes: 11200, msg_bytes: 1400, deadline_s: 1.5}
events:
  - {t_s: 2.6, kind: bw_change, target: "rack1-spine", bw_mbps: 75}
