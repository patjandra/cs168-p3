# 100 all-to-all rounds, one every 12 ms: 61 Mbps offered per server, just
# under the 66.7 Mbps a rack uplink allows each sender. Nothing is lost, but a
# sender paced below the offered rate falls further behind every round: at 55
# Mbps the rounds climbed from 1.05x to 3.0x by round 100.
id: sustained_load
seed: 1
drain_s: 3
flows:
  - {pattern: incast, src: "sender*", dst: "receiver*", exclude_self: true,
     direction: allreduce, start_s: 1.0, period_s: 0.012, rounds: 100,
     burst_bytes: 11200, msg_bytes: 1400, deadline_s: 1.5}
events: []
