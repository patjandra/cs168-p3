# Every rack uplink drops from 150 to 40 Mbps for good after round 2. At the
# uplink-share rate most packets would be dropped each round; the sender has
# to notice the overload and back off (2.62x at a fixed 66 Mbps).
id: uplinks_cut
seed: 1
drain_s: 3
flows:
  - {pattern: incast, src: "sender*", dst: "receiver*", exclude_self: true,
     direction: allreduce, start_s: 1.0, period_s: 1.0, rounds: 8,
     burst_bytes: 11200, msg_bytes: 1400, deadline_s: 1.5}
events:
  - {t_s: 2.6, kind: bw_change, target: "rack*-spine", bw_mbps: 40}
