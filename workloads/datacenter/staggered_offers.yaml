# Each server's burst starts up to 50 ms late, so rounds trickle in rather
# than arriving all at once.
id: staggered_offers
seed: 1
drain_s: 3
flows:
  - {pattern: incast, src: "sender*", dst: "receiver*", exclude_self: true,
     direction: allreduce, start_s: 1.0, period_s: 1.0, rounds: 6,
     burst_bytes: 11200, msg_bytes: 1400, deadline_s: 1.5, jitter_s: 0.05}
