# Server 4 drops off the network for 1 s in the middle of round 2: both of its
# links black out and lose what they hold. Everything to and from it must be
# resent after it comes back, without flooding the network meanwhile.
id: server_failure
seed: 1
drain_s: 4
flows:
  - {pattern: incast, src: "sender*", dst: "receiver*", exclude_self: true,
     direction: allreduce, start_s: 1.0, period_s: 1.5, rounds: 5,
     burst_bytes: 11200, msg_bytes: 1400, deadline_s: 1.5}
events:
  - {t_s: 2.52, kind: blackout, target: "sender4-rack1", duration_s: 1.0}
  - {t_s: 2.52, kind: blackout, target: "rack1-receiver4", duration_s: 1.0}
