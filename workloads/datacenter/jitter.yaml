# Per-packet delay jitter of +-5 ms on every rack uplink: packets arrive out
# of order and RTT samples vary, which widens the RTO.
id: jitter
seed: 1
drain_s: 3
flows:
  - {pattern: incast, src: "sender*", dst: "receiver*", exclude_self: true,
     direction: allreduce, start_s: 1.0, period_s: 1.0, rounds: 6,
     burst_bytes: 11200, msg_bytes: 1400, deadline_s: 1.5}
events:
  - {t_s: 0.5, kind: delay_change, target: "rack0-spine", delay_ms: 5, jitter_ms: 5}
  - {t_s: 0.5, kind: delay_change, target: "rack1-spine", delay_ms: 5, jitter_ms: 5}
  - {t_s: 0.5, kind: delay_change, target: "rack2-spine", delay_ms: 5, jitter_ms: 5}
